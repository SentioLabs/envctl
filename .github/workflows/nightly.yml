name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Create or retry nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/nightly.sh

  cleanup:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete nightly releases older than 7 days
        uses: actions/github-script@v9
        with:
          script: |
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 7);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            for (const release of releases) {
              if (!/^v\d+\.\d+\.\d+-nightly\.\d{8}$/.test(release.tag_name)) continue;
              if (new Date(release.created_at) >= cutoff) continue;
              console.log(`Deleting old nightly release: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner, repo: context.repo.repo, release_id: release.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${release.tag_name}`,
                });
              } catch (e) {
                if (e.status !== 404) throw e;
                console.log(`Tag ${release.tag_name} already deleted`);
              }
            }
