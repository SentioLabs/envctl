name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new commits since the last nightly
        id: check
        run: |
          LATEST_NIGHTLY=$(git tag -l 'v*-nightly.*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_NIGHTLY" ]; then
            echo "No previous nightly tag, proceeding"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [ "$(git rev-list "${LATEST_NIGHTLY}..HEAD" --count)" -gt 0 ]; then
            echo "New commits since $LATEST_NIGHTLY"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits since $LATEST_NIGHTLY, skipping"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next patch version
        if: steps.check.outputs.has_changes == 'true'
        id: version
        run: |
          # The manifest holds the last released version. A nightly must sort
          # above it under semver, so tag the next patch: 0.6.0 -> v0.6.1-nightly.<date>.
          RELEASED=$(jq -r '.["."]' .release-please-manifest.json)
          IFS=. read -r MAJOR MINOR PATCH <<< "$RELEASED"
          echo "next=${MAJOR}.${MINOR}.$((PATCH + 1))" >> "$GITHUB_OUTPUT"

      - name: Create nightly tag
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y%m%d)
          TAG="v${{ steps.version.outputs.next }}-nightly.${DATE}"
          echo "Creating tag: $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Nightly build $DATE"
          git push origin "$TAG"
          gh workflow run prerelease.yml --ref "$TAG"

  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete nightly releases older than 7 days
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 7);
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            for (const release of releases.data) {
              if (!release.tag_name.includes('-nightly.')) continue;
              if (new Date(release.created_at) >= cutoff) continue;
              console.log(`Deleting old nightly release: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner, repo: context.repo.repo, release_id: release.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${release.tag_name}`,
                });
              } catch (e) {
                console.log(`Tag ${release.tag_name} already deleted`);
              }
            }
